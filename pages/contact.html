<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yanis NASSI - Portfolio</title>
  <link rel="stylesheet" href="../css/contact.css" />

  <!-- PRISM / CODE VIEWER -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>

  <style>
    @font-face {
      font-family: 'Signatra';
      src: url('../fonts/Signatra.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Helvetica';
      src: url('../fonts/Helvetica.ttc') format('truetype');
    }
    @font-face {
      font-family: "Courier New";
      src: url("../fonts/cour.ttf");
      font-weight: 400;
    }
    body {
      background-color: #202020;
      color: #ffffff;
      font-family: 'Helvetica', sans-serif;
      text-align: center;
      margin: 0;
    }

    header {
      background-color: #181818;
      padding: 10px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    .logo {
      height: 65px;
      margin-right: 40px;
    }

    .name {
      font-family: 'Signatra', sans-serif;
      font-size: 2.8rem;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
      margin: 0;
      padding: 0;
      line-height: 1.1;
    }

    .name a {
      color: #ffffff;
      text-decoration: none;
    }

    .header-right {
      display: flex;
      gap: 30px;
      margin-right: 80px;
    }

    .header-right a {
      font-size: 1.6rem;
      color: #f0f0e6 !important;
      text-decoration: none !important;
      transition: color 0.3s;
    }

    .header-right a:hover {
      color: #00bfff;
    }
  </style>
</head>

<body>
  <!-- HEADER -->
  <header>
    <div class="header-left">
      <a href="../index.html">
        <img src="../images/clipart.png" alt="Logo" class="logo img-sm" />
      </a>
      <h1 class="name"><a href="../index.html" class="home-link">Yanis NASSI</a></h1>
    </div>
    <nav class="header-right">
      <a href="../pages/abtme.html">Bio</a>
      <a href="../pages/portfolio.html">Portfolio</a>
      <a href="../pages/skills.html">Skills</a>
      <a href="../pages/art.html">Art</a>
      <a href="../pages/contact.html">Contact</a>
    </nav>
  </header>

  <!-- MAIN -->
  <main class="contact-main">
    <section class="contact-container">
      <h2 class="paragraph_title">Contact</h2>
      <p class="paragraph_subtitle">
        Thank you for taking the time to visit my site. Feel free to drop me a line if you’d like to connect.
      </p>

      <form id="contact-form" class="contact-form">
        <div class="form-group">
          <label for="name">Your name*</label>
          <input type="text" id="name" name="name" required>
        </div>
      
        <div class="form-group">
          <label for="email">Your email*</label>
          <input type="email" id="email" name="email" required>
        </div>
      
        <div class="form-group">
          <label for="subject">Your subject</label>
          <input type="text" id="subject" name="subject">
        </div>
      
        <div class="form-group">
          <label for="message">Your message</label>
          <textarea id="message" name="message" rows="6"></textarea>
        </div>
      
        <button type="submit" class="submit-button">Send Message</button>
      </form>
      <p id="form-status" class="form-status"></p>
    </section>
  </main>

<script>
  const form = document.getElementById('contact-form');
  const status = document.getElementById('form-status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(form);

    try {
      const response = await fetch("https://formspree.io/f/myzevrbg", {
        method: "POST",
        headers: {
          'Accept': 'application/json'
        },
        body: formData
      });

      if (response.ok) {
        form.style.display = "none";
        status.textContent = "✅ Your message has been sent successfully!";
        status.style.color = "#ffb366";
        status.style.marginTop = "2rem";
        status.style.fontSize = "1.2rem";
      } else {
        status.textContent = "❌ Something went wrong. Please try again.";
        status.style.color = "tomato";
      }
    } catch (error) {
      status.textContent = "❌ Network error. Please try again.";
      status.style.color = "tomato";
    }
  });
</script>

  </script>
</body>
</html>
