<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Yanis NASSI</title>
    <link rel="stylesheet" href="../css/portfolio.css">
    <style>
        @font-face {
            font-family: 'Helvetica';
            src: url('../fonts/Helvetica.ttc') format('truetype');
        }
        body {
            font-family: 'Helvetica', sans-serif;
            text-align: center;
        }
        .portfolio-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 100px;
            padding-top: 50px; 
        }
        .portfolio-title {
            text-align: left;
            margin-top: 100px;
            font-size: 35px;
            color: white; 
        }
        .paragraph_subtitle {
            text-align: left;
            font-size: 24px;
            color: #bdbdbd;
            margin-top: -15px;
            margin-bottom: 40px;
            line-height: 1.9rem;
            font-weight: bold;
}
        .portfolio-categories {
            display: flex;
            justify-content: center;
            gap: 50px; /* Doublement de l'espace entre les images */
            margin-top: 100px; /* Augmentation de l'espacement au-dessus */
        }
        .category-img {
            width: 200px; /* Réduction encore plus importante de la taille */
            border-radius: 15px; /* Arrondir les coins */
            transition: transform 0.3s ease;
        }
        .category-img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-left">
            <a href="../index.html">
                <img src="../images/clipart.png" alt="Logo" class="logo">

    <main class="portfolio-container">
        <h1 class="portfolio-title">Portfolio</h1>
        <p class="paragraph_subtitle">
            Here are some projects I had the chance to work on, classified according to the type of project ( Data Analysis, Websites, and Event Planning ).
        </p>
        
        <div class="portfolio-categories">
            <a href="data_analysis.html" class="category-link">
                <img src="../images/data_analysis_bw.png" alt="Data Analysis Illustration" class="category-img">
            </a>            
            <a href="webapps.html" class="category-link">
